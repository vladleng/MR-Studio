name: Windows JUCE GUI compile
# Compile GUI translation units and run isolated native MIDI host contracts in
# parallel before the heavyweight Windows Release. No app link or package.
# PR/push checks cover both Studio and Live; manual dispatch can target Studio alone.
on:
  workflow_call:
    inputs:
      live:
        type: boolean
        default: false
  pull_request:
    paths:
      - 'apps/studio-juce/**'
      - 'tests/live_*.hpp'
      - 'core/**'
      - 'third_party/**'
      - 'sdk/**'
      - 'assets/ui/**'
      - 'tools/transcription/**'
      - 'tools/separation/**'
      - 'apps/studio-desktop/include/**'
      - 'apps/studio-desktop/src/**'
      - 'tests/midi_*_tests.cpp'
      - 'tests/vst3_fixture.cpp'
      - 'tests/legacy_midi_snapshot.hpp'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'tools/ci/Prepare-Sdks.ps1'
      - 'tools/ci/sdk-lock.json'
      - '.github/workflows/windows-juce-gui-compile.yml'
  push:
    branches: [main]
    paths:
      - 'apps/studio-juce/**'
      - 'tests/live_*.hpp'
      - 'core/**'
      - 'third_party/**'
      - 'sdk/**'
      - 'assets/ui/**'
      - 'tools/transcription/**'
      - 'tools/separation/**'
      - 'apps/studio-desktop/include/**'
      - 'apps/studio-desktop/src/**'
      - 'tests/midi_*_tests.cpp'
      - 'tests/vst3_fixture.cpp'
      - 'tests/legacy_midi_snapshot.hpp'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'tools/ci/Prepare-Sdks.ps1'
      - 'tools/ci/sdk-lock.json'
      - '.github/workflows/windows-juce-gui-compile.yml'
  workflow_dispatch:
    inputs:
      live:
        description: Also compile standalone Live sources
        type: boolean
        default: false
      live_runtime:
        description: Also run targeted Live/VST3 regression tests (no release package)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-windows-juce-gui-compile-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow == 'Windows Studio Release' && github.run_id || '' }}
  cancel-in-progress: true
jobs:
  midi-host:
    name: Native MIDI recording, clips and live contracts (no app package)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify pinned public VST3 SDK (no ASIO)
        shell: pwsh
        run: ./tools/ci/Prepare-Sdks.ps1 -Root build/sdk -PublicGuiOnly
      - name: Configure isolated native host contracts (ARA OFF)
        shell: pwsh
        run: |
          cmake -S . -B build/midi-host -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=ON -DMRS_BUILD_DESKTOP=OFF -DMRS_BUILD_LIVE=OFF -DMRS_BUILD_ASIO=OFF -DMRS_BUILD_ARA=OFF -DMRS_BUILD_JUCE_UI=OFF -DMRS_BUILD_VST3=ON "-DMRS_VST3_SDK_ROOT=$pwd/build/sdk/vst3"
          if($LASTEXITCODE){throw 'MIDI host configure failed'}
      - name: Build MIDI host fixtures only
        shell: pwsh
        run: |
          cmake --build build/midi-host --config Release --parallel 2 --target mrs_vst3_fixture mrs_midi_live_tests mrs_midi_record_tests mrs_midi_clip_tests
          if($LASTEXITCODE){throw 'MIDI host contract build failed'}
      - name: Reproduce native MIDI host regression tests
        shell: pwsh
        run: |
          ctest --test-dir build/midi-host -C Release --output-on-failure --no-tests=error -R '^midi_(live|recording|clips)$'
          if($LASTEXITCODE){throw 'Native MIDI host contracts failed'}
  live-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_runtime }}
    name: Live runtime regression (ARA OFF, no package)
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CHECK_SCOPE: live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/sdk
          key: windows-sdk-${{ hashFiles('tools/ci/sdk-lock.json') }}-false
      - name: Verify SDKs for Live without ARA
        shell: pwsh
        run: ./tools/ci/Prepare-Sdks.ps1 -Ara:$false
      - name: Configure Live regression
        shell: pwsh
        run: ./tools/ci/Configure-Windows.ps1 -Ara:$false
      - name: Build Live and hosted fixture tests
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --parallel 2 --target MRLiveJuce mrs_vst3_tests mrs_subpatch_settings_tests
          if($LASTEXITCODE){throw 'Live regression build failed'}
      - name: Targeted Live runtime tests
        shell: pwsh
        run: |
          ctest --test-dir build/windows -C Release --output-on-failure --no-tests=error -R '^(juce_live_(entry_smoke|application)|processing_subpatch_settings|vst3_(processing|state|editor|desktop|realtime))$'
          $testExit=$LASTEXITCODE
          if(Test-Path build/windows/live-entry-failure.txt){Get-Content build/windows/live-entry-failure.txt}
          if($testExit){throw 'Live runtime regression failed'}
  compile:
    name: Compile JUCE GUI with MSVC (no link/package)
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve Studio/Live compile coverage
        id: coverage
        shell: pwsh
        env:
          REQUESTED_LIVE: ${{ inputs.live }}
        run: |
          $live=($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') -or ($env:REQUESTED_LIVE -eq 'true')
          "live=$($live.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Verify pinned public JUCE/VST3 SDKs (no ASIO)
        shell: pwsh
        run: ./tools/ci/Prepare-Sdks.ps1 -Root build/sdk -PublicGuiOnly
      - name: Configure JUCE GUI without ASIO, ARA or tests
        shell: pwsh
        run: |
          cmake -S . -B build/gui-compile -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=OFF -DMRS_BUILD_DESKTOP=OFF -DMRS_BUILD_LIVE=${{ steps.coverage.outputs.live == 'true' && 'ON' || 'OFF' }} -DMRS_BUILD_ASIO=OFF -DMRS_BUILD_ARA=OFF -DMRS_BUILD_JUCE_UI=ON -DMRS_BUILD_VST3=ON "-DMRS_JUCE_SDK_ROOT=$pwd/build/sdk/juce" "-DMRS_VST3_SDK_ROOT=$pwd/build/sdk/vst3"
          if($LASTEXITCODE){throw 'GUI compile configure failed'}
      - name: Generate and compile binary-data headers
        shell: pwsh
        run: |
          cmake --build build/gui-compile --config Release --parallel 2 --target mrs_juce_assets mrs_concept_assets mrs_track_header_layout mrs_live_layout mrs_reverb_art mrs_control_assets
          if($LASTEXITCODE){throw 'GUI generated assets failed'}
      - name: Compile JUCE GUI sources using actual MSVC /WX flags
        shell: pwsh
        run: |
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild=& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if(-not $msbuild){throw 'MSBuild.exe not found in installed Visual Studio'}
          & $msbuild build/gui-compile/MoonRiverStudioJuce.vcxproj /t:ClCompile /p:Configuration=Release /p:Platform=x64 /p:BuildProjectReferences=false /m:2 /verbosity:minimal
          if($LASTEXITCODE){throw 'JUCE GUI MSVC compilation failed'}
          if('${{ steps.coverage.outputs.live }}' -eq 'true'){
            & $msbuild build/gui-compile/MRLiveJuce.vcxproj /t:ClCompile /p:Configuration=Release /p:Platform=x64 /p:BuildProjectReferences=false /m:2 /verbosity:minimal
            if($LASTEXITCODE){throw 'Live GUI MSVC compilation failed'}
          }
      - name: Record successful source and profile evidence
        run: python tools/ci/ci_evidence.py windows-juce-gui-compile.yml gui ${{ steps.coverage.outputs.live == 'true' && 'gui-live' || '' }}
      - name: Upload check evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-evidence-gui-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14
