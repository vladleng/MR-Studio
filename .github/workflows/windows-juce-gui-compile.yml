name: Windows JUCE GUI compile
# Compile JUCE GUI translation units with the real MSVC project flags before
# the heavyweight, manually dispatched Windows Release. No app link or package.
# PR/push checks cover both Studio and Live; manual dispatch can target Studio alone.
on:
  workflow_call:
    inputs:
      live:
        type: boolean
        default: false
  pull_request:
    paths:
      - 'apps/studio-juce/**'
      - 'core/**'
      - 'third_party/**'
      - 'sdk/**'
      - 'assets/ui/**'
      - 'tools/transcription/**'
      - 'tools/separation/**'
      - 'apps/studio-desktop/include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'tools/ci/Prepare-Sdks.ps1'
      - 'tools/ci/sdk-lock.json'
      - '.github/workflows/windows-juce-gui-compile.yml'
  push:
    branches: [main]
    paths:
      - 'apps/studio-juce/**'
      - 'core/**'
      - 'third_party/**'
      - 'sdk/**'
      - 'assets/ui/**'
      - 'tools/transcription/**'
      - 'tools/separation/**'
      - 'apps/studio-desktop/include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'tools/ci/Prepare-Sdks.ps1'
      - 'tools/ci/sdk-lock.json'
      - '.github/workflows/windows-juce-gui-compile.yml'
  workflow_dispatch:
    inputs:
      live:
        description: Also compile standalone Live sources
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-windows-juce-gui-compile-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow == 'Windows Studio Release' && github.run_id || '' }}
  cancel-in-progress: true
jobs:
  compile:
    name: Compile JUCE GUI with MSVC (no link/package)
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve Studio/Live compile coverage
        id: coverage
        shell: pwsh
        env:
          REQUESTED_LIVE: ${{ inputs.live }}
        run: |
          $live=($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') -or ($env:REQUESTED_LIVE -eq 'true')
          "live=$($live.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Verify pinned public JUCE/VST3 SDKs (no ASIO)
        shell: pwsh
        run: ./tools/ci/Prepare-Sdks.ps1 -Root build/sdk -PublicGuiOnly
      - name: Configure JUCE GUI without ASIO, ARA or tests
        shell: pwsh
        run: |
          cmake -S . -B build/gui-compile -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=OFF -DMRS_BUILD_DESKTOP=OFF -DMRS_BUILD_LIVE=${{ steps.coverage.outputs.live == 'true' && 'ON' || 'OFF' }} -DMRS_BUILD_ASIO=OFF -DMRS_BUILD_ARA=OFF -DMRS_BUILD_JUCE_UI=ON -DMRS_BUILD_VST3=ON "-DMRS_JUCE_SDK_ROOT=$pwd/build/sdk/juce" "-DMRS_VST3_SDK_ROOT=$pwd/build/sdk/vst3"
          if($LASTEXITCODE){throw 'GUI compile configure failed'}
      - name: Generate and compile binary-data headers
        shell: pwsh
        run: |
          cmake --build build/gui-compile --config Release --parallel 2 --target mrs_juce_assets mrs_concept_assets mrs_track_header_layout mrs_live_layout mrs_reverb_art mrs_control_assets
          if($LASTEXITCODE){throw 'GUI generated assets failed'}
      - name: Compile JUCE GUI sources using actual MSVC /WX flags
        shell: pwsh
        run: |
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild=& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if(-not $msbuild){throw 'MSBuild.exe not found in installed Visual Studio'}
          & $msbuild build/gui-compile/MoonRiverStudioJuce.vcxproj /t:ClCompile /p:Configuration=Release /p:Platform=x64 /p:BuildProjectReferences=false /m:2 /verbosity:minimal
          if($LASTEXITCODE){throw 'JUCE GUI MSVC compilation failed'}
          if('${{ steps.coverage.outputs.live }}' -eq 'true'){
            & $msbuild build/gui-compile/MRLiveJuce.vcxproj /t:ClCompile /p:Configuration=Release /p:Platform=x64 /p:BuildProjectReferences=false /m:2 /verbosity:minimal
            if($LASTEXITCODE){throw 'Live GUI MSVC compilation failed'}
          }
      - name: Record successful source and profile evidence
        run: python tools/ci/ci_evidence.py windows-juce-gui-compile.yml gui ${{ steps.coverage.outputs.live == 'true' && 'gui-live' || '' }}
      - name: Upload check evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-evidence-gui-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14
