name: Separation CPU contracts
run-name: MR Studio 0.9.2 — Windows separation CPU smoke
on:
  push:
    branches: ['codex/74-separation-contract', 'codex/74-separation-compatibility']
    paths: ['tools/separation/**', 'tools/separation_check.cpp', 'tests/*separation*', 'apps/studio-juce/src/SeparationRunner*', 'cmake/Separation.cmake', '.github/workflows/separation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: separation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install explicit CPU test runtime (not product startup)
        shell: pwsh
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          if($LASTEXITCODE){throw 'CPU PyTorch install failed'}
          python -m pip install -r tools/separation/requirements-cpu.txt
          if($LASTEXITCODE){throw 'Separation runtime install failed'}
          New-Item -ItemType Directory -Force build/separation-evidence | Out-Null
          python -m pip freeze | Set-Content build/separation-evidence/runtime-freeze.txt
          python -m pip check
          if($LASTEXITCODE){throw 'Incompatible resolved runtime'}
      - name: Python offline contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_separation_worker.py -v
          if($LASTEXITCODE){throw 'Worker contracts failed'}
      - name: Prepare pinned JUCE core only
        shell: pwsh
        run: |
          $lock=Get-Content tools/ci/sdk-lock.json -Raw | ConvertFrom-Json
          git clone --no-checkout --filter=blob:none $lock.juce.url build/juce
          if($LASTEXITCODE){throw 'JUCE clone failed'}
          git -C build/juce fetch --depth 1 origin $lock.juce.commit
          if($LASTEXITCODE){throw 'JUCE fetch failed'}
          git -C build/juce checkout --detach $lock.juce.commit
          if($LASTEXITCODE){throw 'JUCE checkout failed'}
          cmake -S . -B build/separation -DMRS_BUILD_DESKTOP=OFF -DMRS_BUILD_ASIO=OFF -DMRS_BUILD_VST3=OFF -DMRS_BUILD_ARA=OFF -DMRS_BUILD_JUCE_UI=OFF -DMRS_BUILD_SEPARATION_CHECK=ON -DMRS_JUCE_SDK_ROOT="$((Resolve-Path build/juce).Path)" -DPython3_EXECUTABLE="$((Get-Command python).Source)"
          if($LASTEXITCODE){throw 'Runner-only configure failed'}
      - name: Build and test Windows host
        shell: pwsh
        run: |
          cmake --build build/separation --config Release --target mrs_separation_check --parallel 2
          if($LASTEXITCODE){throw 'Runner build failed'}
          ctest --test-dir build/separation -C Release --output-on-failure --no-tests=error -R '^separation_host$'
          if($LASTEXITCODE){throw 'Host contracts failed'}
      - name: Explicitly install smoke model (never part of installer/artifact)
        shell: pwsh
        run: |
          python tools/separation/install_smoke_model.py build/separation-models
          if($LASTEXITCODE){throw 'Smoke model integrity failed'}
      - name: Real CPU inference through Windows host (worker network disabled)
        shell: pwsh
        env:
          MR_SEPARATION_DIAGNOSTICS: '1'
        run: |
          & build/separation/Release/mrs_separation_check.exe --real (Get-Command python).Source "$((Resolve-Path tools/separation/worker.py).Path)" "$((Resolve-Path build/separation-models).Path)" "$((Resolve-Path build/separation-evidence).Path)/audio"
          if($LASTEXITCODE){throw 'Real Windows CPU separation failed'}
      - name: Upload synthetic evidence, no weights/runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MR-Studio-0.9.2-Separation-CPU-${{ github.sha }}
          path: |
            build/separation-evidence/
            build/separation/Testing/Temporary/LastTest.log
