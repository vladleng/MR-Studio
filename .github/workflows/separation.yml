name: Separation CPU contracts
run-name: MR Studio 0.9.6-Upd1 — Windows separation CPU smoke
on:
  push:
    branches: ['codex/74-separation-contract']
    paths: ['tools/separation/**', 'tools/separation_check.cpp', 'tools/separation_project_check.cpp', 'apps/studio-juce/src/SeparationProject*', 'core/src/separation.cpp', 'core/src/sha256.cpp', 'core/src/serialization.cpp', 'core/include/mrs/core.hpp', 'apps/studio-desktop/src/separation_assets.cpp', 'tests/*separation*', 'apps/studio-juce/src/SeparationRunner*', 'apps/studio-juce/src/SeparationModels.cpp', 'apps/studio-juce/src/SeparationModels.h', 'cmake/Separation.cmake', '.github/workflows/separation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: separation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    # Reuse verified model compatibility for GUI or unrelated Studio changes.
    # Native/Core/desktop tests still run in their explicitly selected workflow.
    if: ${{ !contains(github.event.head_commit.message, '[ci separation-ui]') && !contains(github.event.head_commit.message, '[skip separation-cpu]') }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64
      - name: Offline worker contracts before model downloads
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 soundfile==0.13.1
          if($LASTEXITCODE){throw 'Contract dependencies failed'}
          python -I -B -m unittest discover -s tests -p test_separation_worker.py -v
          if($LASTEXITCODE){throw 'Worker contracts failed'}
      - name: Prepare pinned JUCE core only
        shell: pwsh
        run: |
          $lock=Get-Content tools/ci/sdk-lock.json -Raw | ConvertFrom-Json
          git clone --no-checkout --filter=blob:none $lock.juce.url build/juce
          if($LASTEXITCODE){throw 'JUCE clone failed'}
          git -C build/juce fetch --depth 1 origin $lock.juce.commit
          if($LASTEXITCODE){throw 'JUCE fetch failed'}
          git -C build/juce checkout --detach $lock.juce.commit
          if($LASTEXITCODE){throw 'JUCE checkout failed'}
          cmake -S . -B build/separation -DMRS_BUILD_DESKTOP=OFF -DMRS_BUILD_ASIO=OFF -DMRS_BUILD_VST3=OFF -DMRS_BUILD_ARA=OFF -DMRS_BUILD_JUCE_UI=OFF -DMRS_BUILD_SEPARATION_CHECK=ON -DMRS_JUCE_SDK_ROOT="$((Resolve-Path build/juce).Path)" -DPython3_EXECUTABLE="$((Get-Command python).Source)"
          if($LASTEXITCODE){throw 'Runner-only configure failed'}
      - name: Build and test Windows host
        shell: pwsh
        run: |
          cmake --build build/separation --config Release --target mrs_separation_check mrs_separation_project_check --parallel 2
          if($LASTEXITCODE){throw 'Runner build failed'}
          ctest --test-dir build/separation -C Release --output-on-failure --no-tests=error -R '^separation_(host|models)$'
          if($LASTEXITCODE){throw 'Host contracts failed'}
      - name: Explicit managed runtime/model setup and real offline processing
        shell: pwsh
        env:
          MR_SEPARATION_DIAGNOSTICS: '1'
        run: |
          New-Item -ItemType Directory -Force build/separation-evidence | Out-Null
          & build/separation/Release/mrs_separation_check.exe --managed "$((Get-Location).Path)/build/separation-cache" "$((Resolve-Path tools/separation/worker.py).Path)" "$((Resolve-Path tools/separation/requirements-cpu.txt).Path)" "$((Resolve-Path build/separation-evidence).Path)/audio"
          if($LASTEXITCODE){throw 'Managed runtime/model bootstrap or offline inference failed'}
          Copy-Item build/separation-cache/runtimes/cpu-py3119-audiosep048-v1/resolved-packages.txt build/separation-evidence/runtime-freeze.txt
      - name: Real clip to project assets, Undo and relocated Save As
        shell: pwsh
        run: |
          & build/separation/Release/mrs_separation_project_check.exe "$((Get-Location).Path)/build/separation-cache" "$((Resolve-Path tools/separation/worker.py).Path)" "$((Resolve-Path tools/separation/requirements-cpu.txt).Path)" "$((Resolve-Path build/separation-evidence).Path)/project"
          if($LASTEXITCODE){throw 'Real project separation integration failed'}
      - name: Python offline contracts on the managed runtime
        shell: pwsh
        run: |
          & build/separation-cache/runtimes/cpu-py3119-audiosep048-v1/python.exe -I -B -m unittest discover -s tests -p test_separation_worker.py -v
          if($LASTEXITCODE){throw 'Worker contracts failed'}
      - name: Upload synthetic evidence, no weights/runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MR-Studio-0.9.6-Upd1-Separation-CPU-${{ github.sha }}
          path: |
            build/separation-evidence/
            build/separation/Testing/Temporary/LastTest.log
