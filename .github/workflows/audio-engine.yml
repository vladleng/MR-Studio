name: Windows Studio Release
# Product versions are validated against the source header before building.
run-name: ${{ (startsWith(github.event.pull_request.title, '[candidate:studio]') || startsWith(github.event.pull_request.title, '[candidate:studio-ui]')) && 'MR Studio 0.11.1 — Windows candidate' || startsWith(github.event.pull_request.title, '[candidate:live]') && 'MR Live 0.9.3-Upd9 — Windows candidate' || startsWith(github.event.pull_request.title, '[candidate:studio-live]') && 'MR Studio 0.11.1 / MR Live 0.9.3-Upd9 — Windows candidate' || (inputs.checks == 'live' && !inputs.integration && 'MR Live 0.9.3-Upd9 — Windows Release' || ((inputs.checks == 'studio' || inputs.checks == 'studio-ui' || inputs.checks == 'separation' || inputs.checks == 'separation-ui') && !inputs.integration && 'MR Studio 0.11.1 — Windows Release' || 'MR Studio 0.11.1 / MR Live 0.9.3-Upd9 — Windows Release')) }}
# Heavy acceptance packages are explicit: manual dispatch OR one PR title request.
# An ordinary commit, body edit or title edit never launches a Windows build.
on:
  pull_request:
    types: [edited]
  workflow_dispatch:
    inputs:
      integration:
        description: Complete integration suite
        type: boolean
        default: false
      checks:
        description: Targeted Live/separation checks or normal profile
        type: choice
        options: [profile, studio, studio-ui, studio-live, live, separation, separation-ui]
        default: profile
      ara:
        description: Include ARA2 for Studio profile (Live-only always excludes ARA2)
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
env:
  RELEASE_BANNER: 'MR Studio 0.11.1 / MR Live 0.9.3-Upd9 — Windows Release'
concurrency:
  group: windows-${{ (github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.title.from != null && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && !startsWith(github.event.changes.title.from, '[candidate:') && ((startsWith(github.event.pull_request.title, '[candidate:studio]') || startsWith(github.event.pull_request.title, '[candidate:studio-ui]')) || startsWith(github.event.pull_request.title, '[candidate:live]') || startsWith(github.event.pull_request.title, '[candidate:studio-live]'))) && format('candidate-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('{0}-{1}-{2}-{3}', github.ref, inputs.checks, inputs.integration, inputs.ara) || github.run_id }}
  cancel-in-progress: true
jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.title.from != null && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && !startsWith(github.event.changes.title.from, '[candidate:') && ((startsWith(github.event.pull_request.title, '[candidate:studio]') || startsWith(github.event.pull_request.title, '[candidate:studio-ui]')) || startsWith(github.event.pull_request.title, '[candidate:live]') || startsWith(github.event.pull_request.title, '[candidate:studio-live]'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.request.outputs.scope }}
      integration: ${{ steps.request.outputs.integration }}
      ara: ${{ steps.request.outputs.ara }}
      sha: ${{ steps.request.outputs.sha }}
      ref: ${{ steps.request.outputs.ref }}
      automatic: ${{ steps.request.outputs.automatic }}
      need_core: ${{ steps.evidence.outputs.need_core }}
      need_gui: ${{ steps.evidence.outputs.need_gui }}
      need_contracts: ${{ steps.evidence.outputs.need_contracts }}
      need_runtime: ${{ steps.evidence.outputs.need_runtime }}
      need_separation: ${{ steps.evidence.outputs.need_separation }}
      need_mp3: ${{ steps.evidence.outputs.need_mp3 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve explicit candidate
        id: request
        env:
          REQUEST_CHECKS: ${{ inputs.checks }}
          REQUEST_INTEGRATION: ${{ inputs.integration }}
          REQUEST_ARA: ${{ inputs.ara }}
        run: python3 tools/ci/candidate_request.py
      - name: Reuse completed evidence and schedule only missing checks
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.request.outputs.sha }}
          CANDIDATE_REF: ${{ steps.request.outputs.ref }}
          RELEASE_CHECKS: ${{ steps.request.outputs.scope }}
          INTEGRATION: ${{ steps.request.outputs.integration }}
          CI_GATE_MODE: ${{ steps.request.outputs.automatic == 'true' && 'plan' || 'manual-plan' }}
        run: python3 tools/ci/verify_ci_evidence.py

  core:
    needs: plan
    if: ${{ needs.plan.outputs.automatic == 'true' && needs.plan.outputs.need_core == 'true' }}
    uses: ./.github/workflows/core-contracts.yml
    with:
      checks: profile

  gui:
    needs: plan
    if: ${{ needs.plan.outputs.automatic == 'true' && needs.plan.outputs.need_gui == 'true' }}
    uses: ./.github/workflows/windows-juce-gui-compile.yml
    with:
      live: ${{ needs.plan.outputs.scope != 'studio' }}

  contracts:
    needs: plan
    if: ${{ needs.plan.outputs.automatic == 'true' && needs.plan.outputs.need_contracts == 'true' }}
    uses: ./.github/workflows/transcription-contracts.yml

  runtime:
    needs: plan
    if: ${{ needs.plan.outputs.automatic == 'true' && needs.plan.outputs.need_runtime == 'true' }}
    uses: ./.github/workflows/transcription-runtime.yml

  separation:
    needs: plan
    if: ${{ needs.plan.outputs.automatic == 'true' && needs.plan.outputs.need_separation == 'true' }}
    uses: ./.github/workflows/separation.yml

  mp3:
    needs: plan
    if: ${{ needs.plan.outputs.automatic == 'true' && needs.plan.outputs.need_mp3 == 'true' }}
    uses: ./.github/workflows/windows-mp3-export.yml

  preflight:
    needs: [plan, core, gui, contracts, runtime, separation, mp3]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - name: Require completed candidate checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.plan.outputs.sha }}
          CANDIDATE_REF: ${{ needs.plan.outputs.ref }}
          RELEASE_CHECKS: ${{ needs.plan.outputs.scope }}
          INTEGRATION: ${{ needs.plan.outputs.integration }}
          CI_GATE_MODE: ${{ needs.plan.outputs.automatic == 'true' && 'automatic' || 'verify' }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/verify_ci_evidence.py

  studio:
    needs: [plan, preflight]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.preflight.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # Studio PR/push profiles retain ARA2 ON by default. The targeted Live
      # scope forces ARA2 OFF before SDK acquisition, configure and packaging.
      # Manual Studio ARA-OFF builds remain diagnostic only.
      ARA: ${{ needs.plan.outputs.ara }}
      CHECK_SCOPE: ${{ needs.plan.outputs.scope }}
      INTEGRATION: ${{ needs.plan.outputs.integration }}
      SOURCE_SHA: ${{ needs.plan.outputs.sha }}
      SOURCE_REF: ${{ needs.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 2
      - name: Reject superseded candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $current=gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:SOURCE_REF" --jq .sha
          if($LASTEXITCODE -or $current -ne $env:SOURCE_SHA){throw 'Candidate ref advanced; select the current SHA'}
          $checked=git rev-parse HEAD
          if($LASTEXITCODE -or $checked -ne $env:SOURCE_SHA){throw 'Candidate checkout SHA mismatch'}
      - name: Select explicitly requested check scope
        id: live_scope
        shell: pwsh
        run: |
          $scope=$env:CHECK_SCOPE
          if($env:INTEGRATION -eq 'true'){$scope='integration'}
          # 0.8.10 acceptance: verify exact saved snapshots and Save/Undo state.
          # The Live-only executable is intentionally ARA-free. Keep ARA ON
          # by default for Studio/profile, including ARA tests and packaging.
          $buildAra=if($scope -eq 'live'){'false'}else{$env:ARA.ToLowerInvariant()}
          $studioMatch=[regex]::Match($env:RELEASE_BANNER,'MR Studio (0\.[0-9]+\.[0-9]+(?:-(?:fix|Upd)[0-9]+)?)')
          $liveMatch=[regex]::Match($env:RELEASE_BANNER,'MR Live (0\.[0-9]+\.[0-9]+(?:-(?:fix|Upd)[0-9]+)?)')
          if(!$studioMatch.Success -or !$liveMatch.Success){throw "Invalid release banner: $env:RELEASE_BANNER"}
          $studioVersion=$studioMatch.Groups[1].Value
          $liveVersion=$liveMatch.Groups[1].Value
          # Application/diagnostic versions must carry the same full suffix as
          # the run, manifest and every artifact. Numeric PE FILEVERSION is separate.
          $versionHeader=Get-Content -LiteralPath 'apps/studio-desktop/include/mrs/version.hpp' -Raw
          $sourceStudio=[regex]::Match($versionHeader,'(?m)^inline constexpr std::string_view application_version\s*=\s*"([^"]+)";')
          $sourceLive=[regex]::Match($versionHeader,'(?m)^inline constexpr std::string_view live_application_version\s*=\s*"([^"]+)";')
          if(!$sourceStudio.Success -or $sourceStudio.Groups[1].Value -cne $studioVersion){
            throw "Studio application version differs from release banner $studioVersion"
          }
          if(!$sourceLive.Success -or $sourceLive.Groups[1].Value -cne $liveVersion){
            throw "Live application version differs from release banner $liveVersion"
          }
          $studioOnly=$scope -in @('studio','studio-ui','separation-ui','separation')
          "STUDIO_ONLY=$($studioOnly.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $artifactVersion=if($scope -eq 'live'){"MR-Live-$liveVersion"}elseif($studioOnly){"MR-Studio-$studioVersion"}else{"MR-Studio-$studioVersion-MR-Live-$liveVersion"}
          "MR_STUDIO_VERSION=$studioVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MR_LIVE_VERSION=$liveVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_ARTIFACT_VERSION=$artifactVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CHECK_SCOPE=$scope" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUILD_ARA=$buildAra" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ara=$buildAra" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "scope=$scope" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Check scope: $scope; ARA build: $buildAra"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/sdk
          key: windows-sdk-${{ hashFiles('tools/ci/sdk-lock.json') }}-${{ steps.live_scope.outputs.ara }}
      - name: Verify SDKs; never cache ASIO
        shell: pwsh
        run: ./tools/ci/Prepare-Sdks.ps1 -Ara:($env:BUILD_ARA -eq 'true')
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: github.event_name != 'pull_request'
        with:
          path: build/sdk
          key: windows-sdk-${{ hashFiles('tools/ci/sdk-lock.json') }}-${{ steps.live_scope.outputs.ara }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: env.CHECK_SCOPE == 'studio'
        with:
          python-version: '3.11'
      - name: Separation CPU contract and actual Torch ISA probe
        if: env.CHECK_SCOPE == 'studio'
        shell: pwsh
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 soundfile==0.13.1 onnxruntime==1.22.1
          if($LASTEXITCODE){throw 'Separation test dependencies failed'}
          python -m unittest discover -s tests -p test_separation_worker.py -q
          if($LASTEXITCODE){throw 'Separation CPU contract failed'}
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          if($LASTEXITCODE){throw 'Official Torch CPU test runtime install failed'}
          python -m pip install mido==1.3.3
          if($LASTEXITCODE){throw 'MIDI interchange test dependency failed'}
          python -m unittest discover -s tests -p test_transcription_worker.py -q
          if($LASTEXITCODE){throw 'Python MIDI interchange tests failed'}
          python tools/separation/probe_cpu.py --output build/separation-cpu-runtime.json
          if($LASTEXITCODE){throw 'Torch CPU dispatch probe failed'}
      - name: Configure JUCE VST3 ASIO
        shell: pwsh
        run: ./tools/ci/Configure-Windows.ps1 -Ara:($env:BUILD_ARA -eq 'true') -StudioOnly:($env:STUDIO_ONLY -eq 'true')
      - name: Build Release
        id: build
        shell: pwsh
        run: |
          $args=@('--build','build/windows','--config','Release','--parallel','2')
          if($env:CHECK_SCOPE -eq 'separation'){$args+=@('--target','mrs_separation_check')}
          elseif($env:CHECK_SCOPE -eq 'separation-ui'){$args+=@('--target','MoonRiverStudioJuce')}
          elseif($env:CHECK_SCOPE -eq 'studio-ui'){$args+=@('--target','MoonRiverStudioJuce','mrs_midi_live_tests','mrs_midi_record_tests','mrs_midi_clip_tests')}
          elseif($env:CHECK_SCOPE -eq 'studio'){$args+=@('--target','MoonRiverStudioJuce','mrs_core_tests','mrs_audio_to_midi_tests','mrs_ace_midi_protocol_tests','mrs_audio_to_midi_worker_tests','mrs_python_transcription_tests','mrs_transcription_controller_tests','mrs_midi_import_tests','mrs_separation_assets_tests','mrs_persistence_tests','mrs_desktop_tests','mrs_wav_import_tests','mrs_separation_check')}
          elseif($env:CHECK_SCOPE -eq 'studio-live'){$args+=@('--target','MoonRiverStudioJuce','mrs_core_tests','mrs_audio_to_midi_tests','mrs_ace_midi_protocol_tests','mrs_audio_to_midi_worker_tests','mrs_python_transcription_tests','mrs_transcription_controller_tests','mrs_midi_import_tests','mrs_separation_assets_tests','mrs_persistence_tests','mrs_desktop_tests','mrs_wav_import_tests','mrs_separation_check')}
          elseif($env:CHECK_SCOPE -eq 'live'){$args+=@('--target','MRLiveJuce','mrs_audio_tests','mrs_live_preload_tests','mrs_parallel_tests','mrs_vst3_tests','mrs_subpatch_settings_tests')}
          elseif($env:INTEGRATION -ne 'true'){
            $args+=@('--target','MoonRiverStudioJuce','mrs_core_tests','mrs_audio_to_midi_tests','mrs_ace_midi_protocol_tests','mrs_audio_to_midi_worker_tests','mrs_python_transcription_tests','mrs_transcription_controller_tests','mrs_midi_import_tests','mrs_core_check','mrs_ai_tests','mrs_ai_query_tests','mrs_ai_tool_tests','mrs_audio_tests','mrs_ahead_tests','mrs_mixed_tests','mrs_desktop_tests','mrs_sample_library_tests','mrs_wav_import_tests','mrs_clip_stretch_tests','mrs_track_stretch_mode_tests','mrs_clip_response_tests','mr_timestretch_drums_tests','mr_timestretch_drums_example','mrs_stretch_contract_tests','mrs_stretch_tests','mrs_stretch_bench')
            $args+=@('mrs_separation_check','mrs_separation_assets_tests','mrs_persistence_tests')
          }
          if($env:CHECK_SCOPE -in @('studio','studio-live','profile')){
            $args+=@('mrs_vst3_tests','mrs_midi_live_tests','mrs_midi_record_tests','mrs_midi_clip_tests','mrs_reverb_library_tests','mrs_reverb_tests','mrs_mp3_export_tests')
            if($env:BUILD_ARA -eq 'true'){$args+=@('mrs_ara_tests','mrs_ara_clip_tests','mrs_ai_ara_tests')}
          }
          & cmake @args
          if($LASTEXITCODE){throw 'Release build failed'}
      - name: Test profile
        id: test
        shell: pwsh
        run: |
          $args=@('--test-dir','build/windows','-C','Release','--output-on-failure','--no-tests=error','--output-junit',(Join-Path (Get-Location) 'build/windows/tests.xml'))
          if($env:CHECK_SCOPE -eq 'separation'){$args+=@('-R','^separation_(host|models)$')}
          elseif($env:CHECK_SCOPE -eq 'separation-ui'){$args+=@('-R','^juce_separation_(models|project)$')}
          elseif($env:CHECK_SCOPE -eq 'studio-ui'){
            $requiredUiTests=@('juce_note_grid','juce_drum_grid','midi_live','midi_recording','midi_clips')
            $testList=ctest --test-dir build/windows -C Release --show-only=json-v1
            if($LASTEXITCODE){throw 'MIDI/UI test enumeration failed'}
            $registered=($testList | Out-String | ConvertFrom-Json).tests.name
            foreach($testName in $requiredUiTests){if($testName -notin $registered){throw "Missing required MIDI/UI test: $testName"}}
            $args+=@('-R',('^('+($requiredUiTests -join '|')+')$'))
          }
          elseif($env:CHECK_SCOPE -eq 'studio'){$args+=@('-R','^(separation_(host|models)|midi_import|juce_(transcription|separation_(models|project)|track_folders|wav_drop)|core_(ace_midi_protocol|audio_to_midi|model|commands|serialization|remove_tracks)|desktop_(python_transcription|transcription_controller|audio_to_midi_worker|separation_assets|remove_tracks|wav_import)|persistence_(roundtrip|migrations|compatibility|atomic|recovery))$')}
          elseif($env:CHECK_SCOPE -eq 'studio-live'){$args+=@('-R','^(midi_import|juce_(transcription|separation_(models|project)|track_folders|wav_drop|live_(entry_smoke|application))|core_(ace_midi_protocol|audio_to_midi|model|commands|serialization|remove_tracks)|desktop_(python_transcription|transcription_controller|audio_to_midi_worker|separation_assets|remove_tracks|wav_import)|separation_(host|models)|persistence_(roundtrip|migrations|compatibility|atomic|recovery))$')}
          elseif($env:CHECK_SCOPE -eq 'live'){$args+=@('-R','^(juce_live_(entry_smoke|application)|audio_(metronome|performance|parallel_(equivalence|ownership|profiling))|desktop_live_preload|processing_subpatch_settings|vst3_(processing|state|editor|desktop|realtime))$','--verbose')}
          elseif($env:INTEGRATION -ne 'true'){$args+=@('-R','^(midi_import|core_(ace_midi_protocol|audio_to_midi|stretch_contract|model|transport|commands|serialization|track_folders|remove_tracks)|stretch_.*|clip_stretch_.*|track_stretch_mode|drums_sdk_.*|ai_.*|ara_.*|juce_(transcription|separation_(models|project)|live_application|live_entry_smoke|clip_stretch|library_browser|j1_smoke|track_header_layout|track_folders|ai_assistant|ai_permissions|ara_editor)|audio_(transport|streaming|recording|mixer|buses|sends|pdc|ahead_.*|mixed_.*|sample_library)|desktop_(python_transcription|transcription_controller|audio_to_midi_worker|separation_assets|wav_import|track_folders|remove_tracks|clip_response)|persistence_(roundtrip|migrations|compatibility|atomic|recovery))$')}
          if($env:CHECK_SCOPE -eq 'profile'){$args+=@('-E','^(ara_.*|ai_ara|juce_ara_editor)$')}
          & ctest @args
          $profileExit=$LASTEXITCODE
          if($profileExit){
            if(Test-Path 'build/windows/separation-project-failure.txt'){Get-Content 'build/windows/separation-project-failure.txt'}
            if(Test-Path 'build/windows/separation-models-failure.txt'){Get-Content 'build/windows/separation-models-failure.txt'}
            if(Test-Path 'build/windows/wav-drop-failure.txt'){Get-Content 'build/windows/wav-drop-failure.txt'}
            if(Test-Path 'build/windows/folders266-failure.txt'){Get-Content 'build/windows/folders266-failure.txt'}
            if(Test-Path 'build/windows/live-application-failure.txt'){Get-Content 'build/windows/live-application-failure.txt'}
            if(Test-Path 'build/windows/live-entry-failure.txt'){Get-Content 'build/windows/live-entry-failure.txt'}
            if(Test-Path 'build/windows/library261-failure.txt'){Get-Content 'build/windows/library261-failure.txt'}
          }
          $separationExit=0
          if($env:CHECK_SCOPE -notin @('live','separation','separation-ui','studio','studio-ui','studio-live')){
            & ctest --test-dir build/windows -C Release --output-on-failure --no-tests=error -R '^separation_(host|models)$'
            $separationExit=$LASTEXITCODE
          }
          if($profileExit -or $separationExit){throw "CTest failed ($env:CHECK_SCOPE); profile=$profileExit separation=$separationExit"}
      - name: VST3 and ARA host contracts
        id: host
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (env.CHECK_SCOPE == 'studio' || env.CHECK_SCOPE == 'studio-live' || env.CHECK_SCOPE == 'profile') }}
        shell: pwsh
        run: |
          $pattern=if($env:BUILD_ARA -eq 'true'){'^(vst3_.*|midi_(live|recording|clips)|ara_.*|ai_ara|juce_ara_editor)$'}else{'^(vst3_.*|midi_(live|recording|clips))$'}
          ctest --test-dir build/windows -C Release --output-on-failure --no-tests=error -R $pattern
          if($LASTEXITCODE){throw 'Host contracts failed'}
      - name: Offline audio export contracts
        id: export
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (env.CHECK_SCOPE == 'studio' || env.CHECK_SCOPE == 'studio-live' || env.CHECK_SCOPE == 'profile') }}
        shell: pwsh
        run: |
          ctest --test-dir build/windows -C Release --output-on-failure --no-tests=error -R '^(desktop_(offline_export|reverb|cab_collection|cab_combo)|audio_(reverb_library|mp3_export)|processing_(reverb|rig)|juce_export_audio)$'
          if($LASTEXITCODE){
            if(Test-Path 'build/windows/export-audio-failure.txt'){Get-Content 'build/windows/export-audio-failure.txt'}
            throw 'Offline export contracts failed'
          }
      - name: Stretch foundation evidence (synthetic, not ASIO)
        id: stretch
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.CHECK_SCOPE != 'live' && env.CHECK_SCOPE != 'separation' && env.CHECK_SCOPE != 'separation-ui' && env.CHECK_SCOPE != 'studio' && env.CHECK_SCOPE != 'studio-ui' && env.CHECK_SCOPE != 'studio-live' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/stretch-evidence | Out-Null
          Copy-Item build/windows/Release/mrs_stretch_bench.exe build/stretch-evidence/
          Copy-Item third_party/signalsmith-stretch/LICENSE.txt build/stretch-evidence/Signalsmith-Stretch-LICENSE.txt
          Copy-Item third_party/signalsmith-linear/LICENSE.txt build/stretch-evidence/Signalsmith-Linear-LICENSE.txt
          & build/windows/Release/mrs_stretch_bench.exe --impulse-report | Set-Content build/stretch-evidence/impulses.csv
          if($LASTEXITCODE){throw 'Stretch impulse diagnostic failed'}
          & build/windows/Release/mrs_stretch_bench.exe --seconds 10 --warmup 1 --ratio 1 --output build/stretch-evidence/source.wav | Set-Content build/stretch-evidence/source.csv
          if($LASTEXITCODE){throw 'Stretch source fixture failed'}
          & build/windows/Release/mrs_stretch_bench.exe --seconds 10 --warmup 1 --ratio 1.25 --output build/stretch-evidence/ratio-1.25.wav | Set-Content build/stretch-evidence/ratio.csv
          if($LASTEXITCODE){throw 'Stretch ratio fixture failed'}
          & build/windows/Release/mrs_stretch_bench.exe --seconds 10 --warmup 1 --ratio 1 --pitch 7 --output build/stretch-evidence/pitch-7.wav | Set-Content build/stretch-evidence/pitch.csv
          if($LASTEXITCODE){throw 'Stretch pitch fixture failed'}
          @("MR Studio $env:MR_STUDIO_VERSION stretch foundation. Synthetic evidence, not ASIO or user listening acceptance.", 'mrs_stretch_bench.exe --seconds 300 --warmup 30 --repeats 3 --voices 8 --ratio 1.25', 'Experimental manual clip controls/cache playback are integrated; final realtime/quality acceptance remains in #59/#62.') | Set-Content build/stretch-evidence/README.txt
          Get-ChildItem build/stretch-evidence -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 240 | Set-Content build/stretch-evidence/SHA256.txt
      - name: Upload stretch evidence
        if: ${{ !cancelled() && steps.stretch.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_ARTIFACT_VERSION }}-Stretch-Evidence-${{ needs.plan.outputs.sha }}
          path: build/stretch-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Reject superseded package
        id: current
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $current=gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:SOURCE_REF" --jq .sha
          if($LASTEXITCODE -or $current -ne $env:SOURCE_SHA){throw 'Candidate ref advanced; select the current SHA'}
          $checked=git rev-parse HEAD
          if($LASTEXITCODE -or $checked -ne $env:SOURCE_SHA){throw 'Candidate checkout SHA mismatch'}
      - name: Package development acceptance candidate
        id: package
        if: success() && steps.build.outcome == 'success' && steps.test.outcome == 'success' && steps.current.outcome == 'success' && env.CHECK_SCOPE != 'separation'
        shell: pwsh
        env:
          CI_TEST_RESULT: ${{ steps.test.outcome == 'success' && (steps.host.outcome == 'success' || steps.host.outcome == 'skipped') && (steps.export.outcome == 'success' || steps.export.outcome == 'skipped') && 'success' || 'failure' }}
          CI_CHECK_SCOPE: ${{ env.CHECK_SCOPE }}
        run: ./tools/ci/Package-Windows.ps1 -Ara:($env:BUILD_ARA -eq 'true') -StudioOnly:($env:STUDIO_ONLY -eq 'true') -LiveOnly:($env:CHECK_SCOPE -eq 'live')
      - name: Upload Windows runtime
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_ARTIFACT_VERSION }}-Windows-${{ needs.plan.outputs.sha }}-ara-${{ steps.live_scope.outputs.ara }}
          path: build/package/
          if-no-files-found: error
          retention-days: 14
      - name: Upload symbols
        if: always() && steps.build.outcome == 'success' && steps.current.outcome == 'success' && env.CHECK_SCOPE != 'separation'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_ARTIFACT_VERSION }}-Windows-symbols-${{ needs.plan.outputs.sha }}-ara-${{ steps.live_scope.outputs.ara }}
          path: |
            build/windows/MoonRiverStudioJuce_artefacts/Release/*.pdb
            build/windows/MRLiveJuce_artefacts/Release/*.pdb
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_ARTIFACT_VERSION }}-Windows-test-results-${{ needs.plan.outputs.sha }}-ara-${{ steps.live_scope.outputs.ara }}
          path: |
            build/windows/transcription-*.png
            build/windows/separation-models-*.png
            build/windows/separation-project-*.png
            build/windows/juce-live-entry-*.png
            build/windows/juce-live-interface-*.png
            build/windows/juce-library261-*.png
            build/windows/juce-folder-mixer-*.png
            build/windows/stretch-dialog-*.png
            build/windows/stretch-gui-failure.txt
            build/windows/Testing/
            build/separation-cpu-runtime.json
            build/windows/tests.xml
            build/windows/library256-benchmark.csv
            build/windows/*failure*.txt
            build/windows/validation/**/*failure*.txt
          if-no-files-found: warn
