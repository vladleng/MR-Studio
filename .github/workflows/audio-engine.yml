name: Windows Studio Release
on:
  push:
    branches: [main, 'codex/cloud-cicd-migration']
  pull_request:
    paths: ['apps/**', 'core/**', 'assets/**', 'cmake/**', 'tests/**', 'tools/ci/**', 'CMakeLists.txt', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      integration:
        description: Complete integration suite
        type: boolean
        default: false
      ara:
        description: Include ARA2 in Windows Release (disable only for diagnostic builds)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studio:
    # Migration branch with an open PR would otherwise launch two identical
    # Windows builds on each ordinary commit. The PR is the quick acceptance
    # gate WITH ARA2; extra push runs are only for explicit full integration.
    # Main push release always retains ARA2.
    if: >-
      ${{
        github.event_name != 'push' ||
        github.ref_name != 'codex/cloud-cicd-migration' ||
        contains(github.event.head_commit.message, '[ci full]')
      }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # PR and push always produce a complete ARA2-enabled Windows build.
      # Manual dispatch defaults ON but permits a deliberate ARA-OFF diagnostic.
      ARA: ${{ github.event_name != 'workflow_dispatch' || inputs.ara }}
      INTEGRATION: ${{ inputs.integration || contains(github.event.head_commit.message, '[ci full]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/sdk
          key: windows-sdk-${{ hashFiles('tools/ci/sdk-lock.json') }}-${{ env.ARA }}
      - name: Verify SDKs; never cache ASIO
        shell: pwsh
        run: ./tools/ci/Prepare-Sdks.ps1 -Ara:($env:ARA -eq 'true')
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: github.event_name != 'pull_request'
        with:
          path: build/sdk
          key: windows-sdk-${{ hashFiles('tools/ci/sdk-lock.json') }}-${{ env.ARA }}
      - name: Configure JUCE VST3 ASIO
        shell: pwsh
        run: ./tools/ci/Configure-Windows.ps1 -Ara:($env:ARA -eq 'true')
      - name: Build Release
        id: build
        shell: pwsh
        run: |
          $args=@('--build','build/windows','--config','Release','--parallel','2')
          if($env:INTEGRATION -ne 'true'){
            $args+=@('--target','MoonRiverStudioJuce','mrs_core_tests','mrs_core_check','mrs_ai_tests','mrs_ai_query_tests','mrs_ai_tool_tests','mrs_audio_tests','mrs_ahead_tests','mrs_mixed_tests','mrs_desktop_tests','mrs_sample_library_tests','mrs_wav_import_tests')
            if($env:ARA -eq 'true'){$args+=@('mrs_ara_tests','mrs_ara_clip_tests','mrs_ai_ara_tests')}
          }
          & cmake @args
          if($LASTEXITCODE){throw 'Release build failed'}
      - name: Test profile
        id: test
        shell: pwsh
        run: |
          $args=@('--test-dir','build/windows','-C','Release','--output-on-failure','--no-tests=error','--output-junit',(Join-Path (Get-Location) 'build/windows/tests.xml'))
          if($env:INTEGRATION -ne 'true'){$args+=@('-R','^(core_(model|transport|commands|serialization|track_folders)|ai_.*|ara_.*|juce_(library_browser|j1_smoke|track_header_layout|ai_assistant|ai_permissions|ara_editor)|audio_(transport|streaming|recording|mixer|buses|sends|pdc|ahead_.*|mixed_.*|sample_library)|desktop_(wav_import|track_folders))$')}
          & ctest @args
          if($LASTEXITCODE){
            if(Test-Path 'build/windows/library261-failure.txt'){Get-Content 'build/windows/library261-failure.txt'}
            throw 'CTest failed; full integration never excludes known failures'
          }
      - name: Package development acceptance candidate
        id: package
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        env:
          CI_TEST_RESULT: ${{ steps.test.outcome }}
        run: ./tools/ci/Package-Windows.ps1 -Ara:($env:ARA -eq 'true')
      - name: Upload Windows runtime
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MR-Studio-0.6-upd1-Windows-${{ github.sha }}-ara-${{ env.ARA }}
          path: build/package/
          if-no-files-found: error
          retention-days: 14
      - name: Upload symbols
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Windows-symbols-${{ github.sha }}-ara-${{ env.ARA }}
          path: build/windows/MoonRiverStudioJuce_artefacts/Release/*.pdb
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Windows-test-results-${{ github.sha }}-ara-${{ env.ARA }}
          path: |
            build/windows/juce-library261-*.png
            build/windows/Testing/
            build/windows/tests.xml
            build/windows/library256-benchmark.csv
            build/windows/*failure*.txt
            build/windows/validation/**/*failure*.txt
          if-no-files-found: warn
