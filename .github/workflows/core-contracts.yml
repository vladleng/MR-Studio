name: Fast Core contracts
on:
  push:
    branches: [main, 'codex/cloud-cicd-migration']
    paths: ['core/**', 'apps/studio-desktop/**', 'tests/**', 'CMakeLists.txt', '.github/workflows/core-contracts.yml']
  pull_request:
    paths: ['core/**', 'apps/studio-desktop/**', 'tests/**', 'CMakeLists.txt', '.github/workflows/core-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: cmake -S . -B build/core -DCMAKE_BUILD_TYPE=Release -DMRS_BUILD_ASIO=OFF -DMRS_BUILD_VST3=OFF -DMRS_BUILD_ARA=OFF -DMRS_BUILD_JUCE_UI=OFF
      - run: cmake --build build/core --parallel 2
      - run: ctest --test-dir build/core --output-on-failure --no-tests=error -R '^(core_.*|ai_.*)$'
