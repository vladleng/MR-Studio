name: Fast Core contracts
on:
  workflow_call:
    inputs:
      checks:
        type: string
        default: profile
  push:
    branches: [main, 'codex/cloud-cicd-migration']
    paths: ['core/**', 'cmake/**', 'third_party/**', 'apps/studio-desktop/**', 'tests/**', 'CMakeLists.txt', 'tools/ci/**', 'apps/studio-juce/**', 'sdk/**', '.github/workflows/core-contracts.yml']
  pull_request:
    paths: ['core/**', 'cmake/**', 'third_party/**', 'apps/studio-desktop/**', 'tests/**', 'CMakeLists.txt', 'tools/ci/**', 'apps/studio-juce/**', 'sdk/**', '.github/workflows/core-contracts.yml']
  workflow_dispatch:
    inputs:
      checks:
        description: Core contracts including Live preload and show persistence (both selections run the same suite)
        type: choice
        options: [profile, live]
        default: profile
permissions:
  contents: read
# Cancel obsolete runs of this workflow on the same PR or branch.
# Keep manual checks with distinct selections independent.
concurrency:
  group: ${{ github.workflow }}-fast-core-${{ github.event.pull_request.number || github.ref }}-${{ inputs.checks || 'profile' }}-${{ github.workflow == 'Windows Studio Release' && github.run_id || '' }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Release preflight gate unit tests
        run: python3 -m unittest discover -s tools/ci -p 'test_*gate.py' -v
      - name: Configure Core
        run: cmake -S . -B build/core -DCMAKE_BUILD_TYPE=Release -DMRS_BUILD_ASIO=OFF -DMRS_BUILD_VST3=OFF -DMRS_BUILD_ARA=OFF -DMRS_BUILD_JUCE_UI=OFF
      - name: Build Core contracts
        run: cmake --build build/core --target mrs_audio_tests mrs_parallel_tests mrs_live_preload_tests mrs_core_tests mrs_audio_to_midi_tests mrs_ace_midi_protocol_tests mrs_audio_to_midi_worker_tests mrs_transcription_controller_tests mrs_midi_import_tests mrs_core_check mrs_rig_tests mrs_ai_tests mrs_ai_query_tests mrs_ai_tool_tests mrs_sample_library_tests mrs_wav_import_tests mrs_desktop_tests mrs_clip_stretch_tests mrs_track_stretch_mode_tests mrs_clip_response_tests mrs_separation_assets_tests mrs_persistence_tests mr_timestretch_drums_tests mr_timestretch_drums_example mrs_stretch_contract_tests mrs_stretch_tests mrs_stretch_bench --parallel 2 -- -k
      - name: Core contract test suite
        run: ctest --test-dir build/core --output-on-failure --no-tests=error -R '^(audio_(state_snapshot|transport|streaming|recording|pdc|callback_blocks|parallel_.*)|desktop_live_preload|core_.*|stretch_.*|clip_stretch_.*|track_stretch_mode|drums_sdk_.*|ai_.*|audio_sample_library|desktop_transcription_controller|desktop_audio_to_midi_worker|midi_import|desktop_wav_import|desktop_remove_tracks|desktop_clip_response|desktop_separation_assets|persistence_(show|roundtrip|migrations|compatibility|atomic|recovery))$'
      - name: Record successful source and profile evidence
        run: python tools/ci/ci_evidence.py core-contracts.yml core core-live
      - name: Upload check evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-evidence-core-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14
