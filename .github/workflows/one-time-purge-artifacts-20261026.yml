name: One-time MR Studio artifact cleanup (older than 7 days)

on:
  push:
    branches:
      - maintenance/purge-artifacts-older-than-7d-20261026

permissions:
  contents: read
  actions: write

jobs:
  purge-old-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only MR Studio artifacts older than seven days
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "vladleng/MR-Studio" ]]; then
            echo "Incorrect repository: $GITHUB_REPOSITORY"
            exit 1
          fi

          cutoff="$(date -u -d '7 days ago' +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Deleting GitHub Actions artifacts older than $cutoff in $GITHUB_REPOSITORY"
          # Materialize the full list before deleting anything.
          old_artifacts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | [.id, .size_in_bytes, .created_at, .name] | @tsv")"

          if [[ -z "$old_artifacts" ]]; then
            echo "No artifacts older than seven days found."
            exit 0
          fi

          count=0
          bytes=0
          while IFS=$'\t' read -r id size created name; do
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "Invalid artifact ID"; exit 1; }
            [[ "$size" =~ ^[0-9]+$ ]] || { echo "Invalid artifact size"; exit 1; }
            echo "Deleting artifact: id=$id date=$created size=$size name=$name"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            count=$((count + 1))
            bytes=$((bytes + size))
          done <<< "$old_artifacts"

          echo "Deleted $count artifacts older than seven days; total original artifact bytes: $bytes"
