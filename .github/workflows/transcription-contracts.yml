name: Windows transcription contracts
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['CMakeLists.txt', 'tools/transcription/**', 'tests/test_transcription_diagnostics.py', 'apps/studio-desktop/include/mrs/*transcription*', 'apps/studio-desktop/include/mrs/audio_to_midi_worker.hpp', 'apps/studio-desktop/src/*transcription*', 'apps/studio-desktop/src/audio_to_midi_worker.cpp', 'apps/studio-desktop/src/separation_assets.cpp', 'cmake/**', 'core/**', 'tools/ci/*Package.ps1', 'tests/*transcription*', 'tests/audio_to_midi_worker_tests.cpp', 'tests/python_transcription_tests.cpp', 'tests/python_midi_fake.py', 'tests/separation_assets_tests.cpp', '.github/workflows/transcription-contracts.yml']
  pull_request:
    paths: ['CMakeLists.txt', 'tools/transcription/**', 'tests/test_transcription_diagnostics.py', 'apps/studio-desktop/include/mrs/*transcription*', 'apps/studio-desktop/include/mrs/audio_to_midi_worker.hpp', 'apps/studio-desktop/src/*transcription*', 'apps/studio-desktop/src/audio_to_midi_worker.cpp', 'apps/studio-desktop/src/separation_assets.cpp', 'cmake/**', 'core/**', 'tools/ci/*Package.ps1', 'tests/*transcription*', 'tests/audio_to_midi_worker_tests.cpp', 'tests/python_transcription_tests.cpp', 'tests/python_midi_fake.py', 'tests/separation_assets_tests.cpp', '.github/workflows/transcription-contracts.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-transcription-contracts-${{ github.ref }}-${{ github.workflow == 'Windows Studio Release' && github.run_id || '' }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Python worker diagnostic contracts (no ML or model downloads)
        run: python -m unittest discover -s tests -p test_transcription_diagnostics.py -v
      - name: Reject removed native resources in Windows artifacts
        shell: pwsh
        run: ./tools/ci/Test-RemovedNativePackage.ps1
      - name: Configure headless contracts with the runner Python alias
        shell: pwsh
        run: |
          $alias=(Get-Command python3).Source
          Get-Item $alias | Format-List FullName,LinkType,Target
          cmake -S . -B build/contracts -G 'Visual Studio 17 2022' -A x64 -DMRS_BUILD_DESKTOP=OFF -DMRS_BUILD_LIVE=OFF -DMRS_BUILD_ASIO=OFF -DMRS_BUILD_VST3=OFF -DMRS_BUILD_ARA=OFF -DMRS_BUILD_JUCE_UI=OFF "-DPython3_EXECUTABLE=$alias"
          if($LASTEXITCODE){throw 'Contract configure failed'}
      - name: Build only worker, controller and separation asset contracts
        run: cmake --build build/contracts --config Release --target mrs_python_transcription_tests mrs_audio_to_midi_worker_tests mrs_transcription_controller_tests mrs_separation_assets_tests --parallel 2
      - name: Verify Python alias resolution and adjacent contracts
        run: ctest --test-dir build/contracts -C Release --output-on-failure --no-tests=error -R '^desktop_(python_transcription|audio_to_midi_worker|transcription_controller|separation_assets)$'
