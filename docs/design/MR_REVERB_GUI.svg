<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="438" viewBox="0 0 1020 438" role="img" aria-labelledby="t d">
<title id="t">MR Reverb — compact flat GUI wireframe</title>
<desc id="d">Minimal native convolution reverb with built-in IR browser and Pre-delay, Tone, Mix sliders; no skeuomorphic controls.</desc>
